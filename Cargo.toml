[workspace]
resolver="3"
members=["bin/*", "lib/*"]
# Local checkouts with workspaces of their own (e.g. misc/jackdaw, patched in
# below). Without this, their crates inherit `workspace = true` keys from this
# root instead of their own.
exclude=["misc"]

[workspace.lints]
clippy.too_many_arguments = "allow"
clippy.type_complexity = "allow"
clippy.nonstandard_macro_braces = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"


[patch."https://github.com/cubething-qproj/q_proc"]
q_proc = { path = "lib/q_proc" }

[patch."https://github.com/cubething-qproj/q_screens"]
q_screens = { path = "lib/q_screens" }

[patch."https://github.com/cubething-qproj/q_shell"]
q_shell = { path = "lib/q_shell" }

[patch."https://github.com/cubething-qproj/q_term"]
q_term = { path = "lib/q_term" }

[patch."https://github.com/cubething-qproj/q_test_harness"]
q_test_harness = { path = "lib/q_test_harness" }

[patch."https://github.com/cubething-qproj/q_cam"]
q_cam = {path = "lib/q_cam"}

[patch."https://github.com/ada-x64/jackdaw"]
jackdaw_runtime = { path = "misc/jackdaw/crates/jackdaw_runtime" }
